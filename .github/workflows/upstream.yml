name: Upstream
run-name: "Upstream check (${{ github.event_name }})"

# Daily check of every pin against the latest upstream: the releases of
# versions.yaml (PyPI, GitHub, GitLab; scripts/latest-upstream.py) and the
# digest of every base image. The table goes to the Job Summary and to the
# issue "Upstream releases: pins behind the latest", which is opened or
# updated (with a comment when a new version shows up) and closed once every
# pin is current. Pins are never changed here: a bump is a reviewed change
# that rebuilds and self-tests the images. Shared steps:
# https://github.com/otfabric/.github/tree/main/actions
on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

env:
  BASE_REGISTRY: mirror.gcr.io/library

jobs:
  images:
    name: Base images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: otfabric/.github/actions/upstream-images@v2.1.0

  pins:
    name: Implementations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Compare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/latest-upstream.py --rows "$RUNNER_TEMP/rows"

      - uses: actions/upload-artifact@v7
        with:
          name: upstream-row-implementations
          path: ${{ runner.temp }}/rows

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [images, pins]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: otfabric/.github/actions/upstream-report@v2.1.0
        with:
          needs: ${{ toJSON(needs) }}
          notes: |
            ### To update

            - **Implementation:** bump the pin in its Dockerfile or requirements and in
              `versions.yaml`, then let CI build and self-test it.
            - **Base image:** replace the digest in `versions.yaml` and in every Dockerfile that
              pins it.
