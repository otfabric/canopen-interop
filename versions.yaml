# Machine-readable version manifest for canopen-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles and adapters/*/requirements.txt are the source of truth for
# a build: scripts/check-versions.sh fails when this file disagrees with them.

interop_version: "0.3.0"
contract_version: "1.1"          # docs/CONTAINER_CONTRACT.md; documents carry schemaVersion "1.0" (the 1.x line)
fixture_schema: "1.1"            # fixtures/eds (CiA 306 EDS/DCF), docs/FIXTURES.md; 1.1 adds 0x1007, LSS_Supported=1 and two fixtures

protocol:
  name: "CANopen (CiA 301 SDO/NMT/heartbeat/EMCY/PDO/MPDO/SYNC window, CiA 302 boot-up and concise DCF, CiA 305 LSS, CiA 306 EDS/DCF, CiA 402 drive state machine)"
  not_covered: "CANopen FD (CiA 1301, USDO): none of the pinned open-source stacks implements it"
  transport: "Linux SocketCAN on vcan (host network namespace)"

base_images:
  python: "python:3.12-slim-bookworm@sha256:6dd8b6dab6b3adc7812bab69eca5dbdc1a5cc690ad28306d234ffb4ef8ac9753"
  debian: "debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8"
  dotnet-sdk: "mcr.microsoft.com/dotnet/sdk:8.0-bookworm-slim@sha256:6ba9644da07bb5b560a402acec9ca38711a0762969f1b61da261df5c9f6f85da"

